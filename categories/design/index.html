<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="김민정 브랜드 디자이너 — 디자인" />
    <title>Design — 김민정</title>
    <link rel="stylesheet" href="../common-style.css" />
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="../../index.html" aria-label="홈으로 이동">MJ</a>
      <a class="back-link" href="../../index.html">← All fields</a>
    </header>
    <main class="category-page">
      <section class="category-hero">
        <p class="eyebrow">02 / 04</p>
        <h1>Design</h1>
        <p>브랜드의 인상을 선명한 이미지로 만듭니다.</p>
      </section>
      <section
        class="project-archive design-archive"
        aria-label="Design projects"
      >
        <section class="design-group" aria-labelledby="design-group-1">
          <div class="design-group-heading">
            <span>01</span>
            <h2 id="design-group-1">Product Campaign</h2>
            <span class="design-count">03 Projects</span>
          </div>
          <div class="design-grid">
            <a
              class="design-card"
              href="./projects/protein-pasta/index.html"
              aria-label="영프파"
            >
              <div class="design-thumb">
                <img
                  src="./projects/protein-pasta/thumbnail.png"
                  alt=""
                  onerror="this.hidden = true"
                />
                <div class="design-overlay">
                  <h3>영칼로리포케 프로틴 파스타</h3>
                </div>
              </div>
            </a>
            <a
              class="design-card"
              href="./projects/cassava-chips/index.html"
              aria-label="카사바칩"
            >
              <div class="design-thumb">
                <img
                  src="./projects/cassava-chips/thumbnail.png"
                  alt=""
                  onerror="this.hidden = true"
                />
                <div class="design-overlay"><h3>카사바칩</h3></div>
              </div>
            </a>
            <a
              class="design-card"
              href="./projects/matcha-latte/index.html"
              aria-label="말차라떼"
            >
              <div class="design-thumb">
                <img
                  src="./projects/matcha-latte/thumbnail.png"
                  alt=""
                  onerror="this.hidden = true"
                />
                <div class="design-overlay"><h3>말차라떼</h3></div>
              </div>
            </a>
          </div>
        </section>
        <section class="design-group" aria-labelledby="design-group-2">
          <div class="design-group-heading">
            <span>02</span>
            <h2 id="design-group-2">Packaging Design</h2>
            <span class="design-count">03 Projects</span>
          </div>
          <div class="design-grid">
            <a
              class="design-card"
              href="./projects/frozen-vegetables/index.html"
              aria-label="냉동야채 믹스"
            >
              <div class="design-thumb">
                <img
                  src="./projects/frozen-vegetables/thumbnail.png"
                  alt=""
                  onerror="this.hidden = true"
                />
                <div class="design-overlay"><h3>냉동야채 믹스</h3></div>
              </div>
            </a>
            <a
              class="design-card"
              href="./projects/lunchbox/index.html"
              aria-label="도시락 용기"
            >
              <div class="design-thumb">
                <img
                  src="./projects/lunchbox/thumbnail.png"
                  alt=""
                  onerror="this.hidden = true"
                />
                <div class="design-overlay"><h3>도시락 용기</h3></div>
              </div>
            </a>
            <a
              class="design-card"
              href="./projects/almond/index.html"
              aria-label="아몬드 패키지"
            >
              <div class="design-thumb">
                <img
                  src="./projects/almond/thumbnail.png"
                  alt=""
                  onerror="this.hidden = true"
                />
                <div class="design-overlay"><h3>아몬드 패키지</h3></div>
              </div>
            </a>
          </div>
        </section>
        <section class="design-group" aria-labelledby="design-group-3">
          <div class="design-group-heading">
            <span>03</span>
            <h2 id="design-group-3">Promotion Design</h2>
            <span class="design-count">03 Projects</span>
          </div>
          <div class="design-grid">
            <a
              class="design-card"
              href="./projects/hanging-banner/index.html"
              aria-label="현수막 및 오픈이벤트 사이트"
            >
              <div class="design-thumb">
                <img
                  src="./projects/hanging-banner/thumbnail.png"
                  alt=""
                  onerror="this.hidden = true"
                />
                <div class="design-overlay"><h3>오픈 할인 이벤트</h3></div>
              </div>
            </a>
            <a
              class="design-card"
              href="./projects/poke-game/index.html"
              aria-label="포케 만들기 게임"
            >
              <div class="design-thumb">
                <img
                  src="./projects/poke-game/thumbnail.png"
                  alt=""
                  onerror="this.hidden = true"
                />
                <div class="design-overlay"><h3>포케 게임</h3></div>
              </div>
            </a>
            <a
              class="design-card"
              href="./projects/exam-promotion/index.html"
              aria-label="수능 할인 이벤트"
            >
              <div class="design-thumb">
                <img
                  src="./projects/exam-promotion/thumbnail.png"
                  alt=""
                  onerror="this.hidden = true"
                />
                <div class="design-overlay"><h3>수능 할인 이벤트</h3></div>
              </div>
            </a>
          </div>
        </section>
        <section class="design-group" aria-labelledby="design-group-4">
          <div class="design-group-heading">
            <span>04</span>
            <h2 id="design-group-4">Visual Design</h2>
            <span class="design-count">01 Projects</span>
          </div>
          <div class="design-grid">
            <a
              class="design-card"
              href="./projects/naver-cover/index.html"
              aria-label="네이버 대문 이미지"
            >
              <div class="design-thumb">
                <img
                  src="./projects/naver-cover/thumbnail.png"
                  alt=""
                  onerror="this.hidden = true"
                />
                <div class="design-overlay"><h3>네이버 대문 이미지</h3></div>
              </div>
            </a>
          </div>
        </section>

        <button class="top-button" type="button" aria-label="맨 위로 이동">
          ↑
        </button>
      </section>
    </main>
    <script src="../common-script.js"></script>
  </body>
</html>
